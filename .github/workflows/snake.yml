name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows manual runs at any time
  workflow_dispatch:

  # run on every push to main/master
  push:
    branches:
      - main
      - master

# avoid overlapping runs stepping on each other
concurrency:
  group: snake-animation
  cancel-in-progress: true

env:
  SNAKE_COLOR: "#9C27B0"      # purple snake body
  DOT_COLOR: "#B983E0"        # light purple for contribution dots
  DOT_BORDER: "#6A1B9A"       # dark purple border on dots

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # generates the snake in multiple formats/palettes from your contribution graph
      - name: generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: magiciantk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=${{ env.SNAKE_COLOR }}&color_dot=${{ env.DOT_COLOR }}&color_dot_border=${{ env.DOT_BORDER }}
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}
            dist/github-contribution-grid-snake.gif?color_snake=${{ env.SNAKE_COLOR }}&color_dot=${{ env.DOT_COLOR }}
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=${{ env.SNAKE_COLOR }}

      # push the generated files to the output branch
      - name: push snake animations to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
